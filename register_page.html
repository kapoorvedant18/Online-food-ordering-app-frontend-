<!DOCTYPE html>
<html lang="en" style="height : 100%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="log_reg_style.css">
</head>
<body style="height : 100%; margin : 0;">
    <div class = "container">
    <h1>Welcome!</h1>
    <p>Create an account to get started</p>
    <form action="" onsubmit="event.preventDefault(); register();">
        <input type = "email" id="email" placeholder="Type in your email" required/><br/>
        <input type = "password" id="password" placeholder="Type your password" required/><br/>
        <input type= "submit" value = "Register" class = "btn"/>
    </form>
    </div>
</body>
</html>
